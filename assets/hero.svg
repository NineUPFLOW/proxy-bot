<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">Proxy Bot</title>
  <desc id="desc">Сбор, проверка и публикация Telegram-прокси: MTProto, SOCKS5 и WEB Proxy.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101d32"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="5%" r="80%">
      <stop offset="0" stop-color="#1a5362" stop-opacity=".36"/>
      <stop offset="1" stop-color="#081322" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#80b8c9" stroke-opacity=".075"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#68e5d2"/>
      <stop offset="1" stop-color="#83b5ff"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="400" rx="28" fill="url(#background)"/>
  <rect width="1440" height="400" rx="28" fill="url(#glow)"/>
  <rect width="1440" height="400" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="398" rx="27" fill="none" stroke="#accfe0" stroke-opacity=".16"/>

  <g font-family="'DejaVu Sans', Arial, sans-serif">
    <circle cx="78" cy="74" r="5" fill="#68e5d2"/>
    <text x="96" y="79" fill="#a8becd" font-size="15" font-weight="700" letter-spacing="3">NINEUPFLOW / OPEN SOURCE</text>
    <text x="72" y="167" fill="#f4f9fc" font-size="71" font-weight="800" letter-spacing="-2">PROXY <tspan fill="#70dfd4">BOT</tspan></text>
    <text x="76" y="212" fill="#c7d8e4" font-size="22">Открытые прокси. Проверка из вашей сети.</text>
    <text x="76" y="243" fill="#91a9bd" font-size="17">Сбор · протокольная проверка · публикация</text>
    <g font-size="14" font-weight="700" letter-spacing=".5">
      <rect x="76" y="286" width="120" height="35" rx="17.5" fill="#123b43" stroke="#58d8c6" stroke-opacity=".48"/>
      <text x="136" y="309" text-anchor="middle" fill="#9ff2e3">MTPROTO</text>
      <rect x="207" y="286" width="100" height="35" rx="17.5" fill="#172f4c" stroke="#7aaefa" stroke-opacity=".40"/>
      <text x="257" y="309" text-anchor="middle" fill="#c1d9ff">SOCKS5</text>
      <rect x="318" y="286" width="118" height="35" rx="17.5" fill="#1d2a42" stroke="#97afd0" stroke-opacity=".36"/>
      <text x="377" y="309" text-anchor="middle" fill="#d3e3f0">WEB PROXY</text>
    </g>
    <path d="M76 355H300" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(862 54)">
      <rect width="492" height="292" rx="20" fill="#0a1929" fill-opacity=".89" stroke="#45667b" stroke-opacity=".54"/>
      <text x="28" y="38" fill="#8ba8bb" font-size="13" font-weight="700" letter-spacing="2">THE PIPELINE</text>
      <circle cx="462" cy="33" r="4" fill="#6cdbc9"/>
      <path d="M48 91V217" stroke="#416677" stroke-width="2" stroke-dasharray="3 6"/>
      <g transform="translate(26 62)">
        <rect x="0" y="0" width="440" height="55" rx="12" fill="#10263a" stroke="#294d61"/>
        <circle cx="22" cy="27.5" r="7" fill="#79e4d1"/>
        <text x="45" y="25" fill="#e9f5f8" font-size="15" font-weight="700">01  /  COLLECT</text>
        <text x="45" y="43" fill="#8daabc" font-size="12">HTTPS catalogues and local feeds</text>
      </g>
      <g transform="translate(26 131)">
        <rect x="0" y="0" width="440" height="55" rx="12" fill="#10263a" stroke="#294d61"/>
        <circle cx="22" cy="27.5" r="7" fill="#86b8ff"/>
        <text x="45" y="25" fill="#e9f5f8" font-size="15" font-weight="700">02  /  VERIFY</text>
        <text x="45" y="43" fill="#8daabc" font-size="12">Protocol checks from your network</text>
      </g>
      <g transform="translate(26 200)">
        <rect x="0" y="0" width="440" height="55" rx="12" fill="#10263a" stroke="#294d61"/>
        <circle cx="22" cy="27.5" r="7" fill="#c3a8ff"/>
        <text x="45" y="25" fill="#e9f5f8" font-size="15" font-weight="700">03  /  PUBLISH</text>
        <text x="45" y="43" fill="#8daabc" font-size="12">Fresh recheck, then Telegram Bot API</text>
      </g>
    </g>
  </g>
</svg>
