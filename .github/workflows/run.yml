name: proxy-bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: proxy-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python - <<'PY'
          import os
          required = ["BOT_TOKEN", "CHAT_ID", "API_ID", "API_HASH", "TG_SESSION"]
          missing = [x for x in required if not os.getenv(x)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))
          try:
              int(os.environ["CHAT_ID"])
              int(os.environ["API_ID"])
          except ValueError as exc:
              raise SystemExit("CHAT_ID and API_ID must be integers") from exc
          print("Secrets validation passed")
          PY

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: proxy_state.db
          key: proxy-state-${{ github.run_id }}
          restore-keys: |
            proxy-state-

      - name: Syntax check
        run: python -m compileall -q bot.py checker.py formatter.py sources.py state.py

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LOG_LEVEL: INFO
        run: python -u bot.py

      - name: State statistics
        if: always()
        run: |
          if [ -f proxy_state.db ]; then
            python - <<'PY'
          import sqlite3
          with sqlite3.connect("proxy_state.db") as db:
              seen = db.execute("SELECT COUNT(*) FROM seen_proxies").fetchone()[0]
              published = db.execute("SELECT COUNT(*) FROM published_proxies").fetchone()[0]
          print(f"seen={seen} published={published}")
          PY
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: proxy_state.db
          key: proxy-state-${{ github.run_id }}
