name: Proxy Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python - <<'PY'
          import os
          required = ["BOT_TOKEN", "CHAT_ID", "API_ID", "API_HASH", "TG_SESSION"]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit(f"❌ Missing secrets: {', '.join(missing)}")
          print("✅ Secrets validation passed")
          PY

      - name: Restore state from cache
        uses: actions/cache@v4
        with:
          path: |
            proxy_state.db
            proxy_state.db-wal
            proxy_state.db-shm
          key: proxy-state-${{ github.ref_name }}-${{ runner.os }}
          restore-keys: |
            proxy-state-${{ github.ref_name }}-
            proxy-state-

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u bot.py

      - name: Show state stats
        if: always()
        run: |
          if [ -f proxy_state.db ]; then
            echo "─── State statistics ───"
            python - <<'PY'
          import sqlite3
          try:
              conn = sqlite3.connect("proxy_state.db")
              seen = conn.execute("SELECT COUNT(*) FROM seen_proxies").fetchone()[0]
              pub = conn.execute("SELECT COUNT(*) FROM published_proxies").fetchone()[0]
              print(f" seen_proxies      : {seen}")
              print(f" published_proxies : {pub}")
              conn.close()
          except Exception as e:
              print(f" ⚠️ Failed to read DB: {e}")
          PY
          else
            echo "⚠️ proxy_state.db is missing"
          fi
