      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          echo "── Python version ──"
          python --version
          echo "── Файлы в репо ──"
          ls -la
          echo "── Проверка наличия bot.py ──"
          test -f bot.py && echo "✅ bot.py найден" || echo "❌ bot.py НЕ найден"
          echo "── Запуск бота ──"
          python -u bot.py
