name: Проверка и публикация прокси

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только проверить, без публикации и изменения состояния
        type: boolean
        default: true
      allow_non_ru_dry_run:
        description: Пробная проверка из любой страны; только с dry_run, без публикации
        type: boolean
        default: false
      allow_non_ru_publish:
        description: Разрешить публикацию при проверке из любой страны; не означает проверку из РФ
        type: boolean
        default: false
      publish_count:
        description: Максимум сообщений за запуск
        type: choice
        options:
          - '1'
          - '3'
          - '9'
        default: '9'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

# Share the group with the previous main workflow: different branches must not
# publish at the same time while an external cron is being migrated.
concurrency:
  group: proxy-bot-run
  cancel-in-progress: false

jobs:
  publish:
    # Do not schedule unconfigured GitHub-hosted runners outside Russia.
    # Manual runs still work, but the strict country guard fails closed.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PROXY_RUNNER_LABELS != '' }}
    runs-on: ${{ fromJSON(vars.PROXY_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REQUIRE_RU_CHECK: ${{ vars.REQUIRE_RU_CHECK || '1' }}
      SOURCES_FILE: ${{ vars.SOURCES_FILE || 'sources.json' }}
      PUBLISH_COUNT: ${{ inputs.publish_count || '9' }}

    steps:
      - name: Reject incompatible run options
        if: ${{ (inputs.allow_non_ru_dry_run && !inputs.dry_run) || (inputs.allow_non_ru_publish && inputs.dry_run) }}
        run: |
          echo "::error::allow_non_ru_dry_run требует dry_run; allow_non_ru_publish требует отключить dry_run."
          exit 1
      - name: Validate publication limit
        run: |
          case "$PUBLISH_COUNT" in
            1|3|9) ;;
            *) echo "::error::publish_count должен быть 1, 3 или 9."; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests without credentials
        run: python -m unittest discover -s tests -t . -v
      - name: Restore state
        if: ${{ !inputs.dry_run && !inputs.allow_non_ru_dry_run }}
        uses: actions/cache/restore@v4
        with:
          path: proxy_state.db
          key: proxy-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            proxy-state-${{ github.ref_name }}-
      # Scheduled runs have no workflow_dispatch inputs and still publish.
      # A non-RU diagnostic must never share a step with real publication.
      - name: Dry run
        if: ${{ inputs.dry_run && !inputs.allow_non_ru_dry_run }}
        run: python -u bot.py --dry-run
      - name: Dry run outside Russia
        if: ${{ inputs.dry_run && inputs.allow_non_ru_dry_run }}
        env:
          REQUIRE_RU_CHECK: '0'
        run: |
          echo "::warning::Только пробная проверка из этой сети; публикации нет, работа из РФ не подтверждается."
          python -u bot.py --dry-run
      - name: Check and publish
        if: ${{ !inputs.dry_run && !inputs.allow_non_ru_dry_run }}
        env:
          # Explicit opt-in applies only to this publication step. The default
          # country guard and non-RU dry-run remain independent.
          REQUIRE_RU_CHECK: ${{ inputs.allow_non_ru_publish && '0' || vars.REQUIRE_RU_CHECK || '1' }}
          ALLOW_NON_RU_PUBLISH: ${{ inputs.allow_non_ru_publish }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          BOT_PROXY_URL: ${{ secrets.BOT_PROXY_URL }}
        run: |
          if [ "$ALLOW_NON_RU_PUBLISH" = "true" ]; then
            echo "::warning::Разрешена публикация из любой страны; доступность прокси из РФ не подтверждена."
          fi
          python -u bot.py
      - name: Save state
        if: ${{ always() && !inputs.dry_run && !inputs.allow_non_ru_dry_run && hashFiles('proxy_state.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: proxy_state.db
          key: proxy-state-${{ github.ref_name }}-${{ github.run_id }}
