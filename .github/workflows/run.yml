name: Proxy Bot

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: proxy_state.db
          key: proxy-state-${{ github.run_id }}
          restore-keys: |
            proxy-state-

      - name: State status
        run: |
          if [ -f proxy_state.db ]; then
            echo "✅ Состояние найдено: $(du -h proxy_state.db | cut -f1)"
          else
            echo "ℹ️ Первый запуск — БД будет создана"
          fi

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u bot.py

      - name: Commit state to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f proxy_state.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update proxy_state.db [skip ci]"
            git push
            echo "✅ Состояние сохранено в репозиторий"
          else
            echo "ℹ️ Изменений в state нет"
          fi
